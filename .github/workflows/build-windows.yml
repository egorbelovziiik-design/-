name: Build Windows EXE

on:
  push:
    branches: ['**']
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build renderer & main
        run: npm run build

      - name: Run tests (typecheck + smoke + logic)
        run: npm run test

      - name: Build Windows installers (NSIS + Portable)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          npx electron-builder --win --x64 --publish never 2>&1 | Tee-Object -FilePath electron-builder.log
          "EXIT_CODE=$LASTEXITCODE" | Tee-Object -FilePath ci-status.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List release files
        if: always()
        shell: pwsh
        run: |
          if (Test-Path release) {
            Get-ChildItem -Recurse release | Select-Object FullName, Length | Format-Table -AutoSize | Out-String | Tee-Object -FilePath release-listing.txt
          } else {
            "no release dir" | Tee-Object -FilePath release-listing.txt
          }

      - name: Create GitHub Release with EXE installers
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete wincode-ai-v1.0.0 --yes 2>$null
          gh release create wincode-ai-v1.0.0 --title "WinCode AI v1.0.0 (Windows)" --notes "WinCode-AI-Setup.exe — installer (NSIS). WinCode-AI-Portable.exe — portable build. Built by CI on windows-latest."
          gh release upload wincode-ai-v1.0.0 release/WinCode-AI-Setup.exe release/WinCode-AI-Portable.exe --clobber

      - name: Post diagnostics to issue #1 (API-readable logs)
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          $logTail = "(electron-builder.log not produced)"
          if (Test-Path electron-builder.log) {
            $content = Get-Content electron-builder.log -Raw
            if ($content.Length -gt 55000) { $logTail = $content.Substring($content.Length - 55000) } else { $logTail = $content }
          }
          $fence = [char]0x60 * 3
          $md = "### CI run $env:RUN_ID diagnostics" + "`n" + $fence + "`n" + $logTail + "`n" + $fence + "`n"
          [System.IO.File]::WriteAllText("$env:RUNNER_TEMP\diag.md", $md)
          gh issue comment 1 --repo "${{ github.repository }}" --body-file "$env:RUNNER_TEMP\diag.md"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "issue comment failed, trying Contents API"
            $b64 = [Convert]::ToBase64String([System.IO.File]::ReadAllBytes("electron-builder.log"))
            $json = '{"message":"CI diagnostics run ' + $env:RUN_ID + '","content":"' + $b64 + '"}'
            [System.IO.File]::WriteAllText("$env:RUNNER_TEMP\payload.json", $json)
            gh api -X PUT "repos/${{ github.repository }}/contents/ci-log-$env:RUN_ID.txt" -F "message=CI diagnostics" -F "content=@electron-builder.log" 2>&1 | Out-String | Write-Host
          }

      - name: Commit diagnostics to branch (so logs are visible via git)
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          CI_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "wincode-ci"
          git config user.email "ci@wincode.ai"
          if (Test-Path electron-builder.log) { git add -f electron-builder.log }
          if (Test-Path release-listing.txt) { git add -f release-listing.txt }
          if (Test-Path ci-status.txt) { git add -f ci-status.txt }
          git commit -m "CI diagnostics [skip ci]" --allow-empty
          git push origin "HEAD:${CI_BRANCH}"
