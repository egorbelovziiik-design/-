name: Build Windows EXE

on:
  push:
    branches: ['**']
  workflow_dispatch:
  pull_request:

permissions:
  contents: write
  issues: write

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build renderer & main
        run: npm run build

      - name: Run tests (typecheck + smoke + logic)
        run: npm run test

      - name: Build NSIS installer
        timeout-minutes: 25
        shell: cmd
        run: |
          npx electron-builder --win nsis --x64 --publish never > electron-builder-nsis.log 2>&1
          type electron-builder-nsis.log
          if errorlevel 1 exit /b 1

      - name: Build Portable exe
        timeout-minutes: 25
        shell: cmd
        run: |
          npx electron-builder --win portable --x64 --publish never > electron-builder-portable.log 2>&1
          type electron-builder-portable.log
          if errorlevel 1 exit /b 1

      - name: Combine logs
        if: always()
        shell: pwsh
        run: |
          $parts = @()
          foreach ($f in @('electron-builder-nsis.log','electron-builder-portable.log')) {
            if (Test-Path $f) { $parts += "===== $f ====="; $parts += (Get-Content $f -Raw) }
          }
          $parts -join "`n" | Out-File -Encoding utf8 electron-builder.log
          "EXIT_CODE=see-above" | Out-File -Encoding utf8 ci-status.txt

      - name: List release files
        if: always()
        shell: pwsh
        run: |
          if (Test-Path release) {
            Get-ChildItem -Recurse release | Select-Object FullName, Length | Format-Table -AutoSize | Out-String | Tee-Object -FilePath release-listing.txt
          } else {
            "no release dir" | Out-File -Encoding utf8 release-listing.txt
          }

      - name: Create GitHub Release with EXE installers
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "wincode-ai-v$ver"
          gh release delete $tag --yes 2>$null
          gh release create $tag --title "WinCode AI v$ver (Windows)" --notes "WinCode-AI-Setup.exe — installer (NSIS). WinCode-AI-Portable.exe — portable build. Built by CI."
          gh release upload $tag release/WinCode-AI-Setup.exe release/WinCode-AI-Portable.exe --clobber

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wincode-ai-windows
          path: |
            release/WinCode-AI-Setup.exe
            release/WinCode-AI-Portable.exe
          if-no-files-found: error

      - name: Post diagnostics (issue #1 / Contents API / git)
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          CI_BRANCH: ${{ github.ref_name }}
        run: node scripts/ci-report.mjs
