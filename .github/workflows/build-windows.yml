name: Build Windows EXE

on:
  push:
    branches: ['**']
  workflow_dispatch:
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build renderer & main
        run: npm run build

      - name: Run smoke tests
        run: npm run smoke

      - name: Build Windows installers (NSIS + Portable)
        shell: pwsh
        run: |
          npx electron-builder --win --x64 --publish never 2>&1 | Tee-Object -FilePath electron-builder.log
          if ($LASTEXITCODE -ne 0) { Write-Error "electron-builder failed with $LASTEXITCODE"; exit $LASTEXITCODE }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload electron-builder log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-builder-log
          path: electron-builder.log
          if-no-files-found: ignore

      - name: List artifacts
        if: always()
        shell: pwsh
        run: |
          if (Test-Path release) { Get-ChildItem -Recurse release | Select-Object FullName, Length | Format-Table -AutoSize | Out-String | Tee-Object -FilePath release-listing.txt } else { "no release dir" | Tee-Object -FilePath release-listing.txt }

      - name: Upload listing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-listing
          path: release-listing.txt
          if-no-files-found: ignore

      - name: Upload WinCode-AI-Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: WinCode-AI-Setup
          path: release/WinCode-AI-Setup.exe
          if-no-files-found: error

      - name: Upload WinCode-AI-Portable.exe
        uses: actions/upload-artifact@v4
        with:
          name: WinCode-AI-Portable
          path: release/WinCode-AI-Portable.exe
          if-no-files-found: error

      - name: Upload full release directory
        uses: actions/upload-artifact@v4
        with:
          name: wincode-ai-release-full
          path: release/
          if-no-files-found: error
